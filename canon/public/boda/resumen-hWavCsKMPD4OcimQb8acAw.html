<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen RSVP</title>
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#EFE9DF; color:#322406;
    margin:0; padding:32px 16px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:22px; margin:0 0 24px; }
  .grid{
    display:grid; grid-template-columns:repeat(2,minmax(140px,1fr));
    gap:14px; width:100%; max-width:520px;
  }
  .card{
    background:#fff; border-radius:8px; padding:18px;
    box-shadow:0 2px 10px rgba(60,45,25,.1);
    text-align:center;
  }
  .card .num{ font-size:32px; font-weight:700; }
  .card .label{ font-size:13px; color:#4A3B23; margin-top:4px; }
  #error{ color:#8B3A2A; font-style:italic; display:none; }
</style>
</head>
<body>

<h1>Resumen de confirmaciones</h1>
<div class="grid" id="grid"></div>
<p id="error">No se pudo cargar el resumen.</p>

<script>
(function () {
  var TOKEN = 'hWavCsKMPD4OcimQb8acAw';
  var RESUMEN_API = '/boda/api/resumen';

  var CARDS = [
    { key: 'total_invitados',     label: 'Invitados (hogares)' },
    { key: 'total_respondidos',   label: 'Respondieron' },
    { key: 'total_pendientes',    label: 'Pendientes' },
    { key: 'hogares_asisten',     label: 'Hogares que asisten' },
    { key: 'hogares_no_asisten',  label: 'Hogares que no asisten' },
    { key: 'adultos_confirmados', label: 'Adultos confirmados' },
    { key: 'ninos_confirmados',   label: 'Niños confirmados' }
  ];

  fetch(RESUMEN_API + '?token=' + encodeURIComponent(TOKEN))
    .then(function (r) {
      if (!r.ok) throw new Error('respuesta no exitosa');
      return r.json();
    })
    .then(function (data) {
      var grid = document.getElementById('grid');
      CARDS.forEach(function (c) {
        var div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = '<div class="num">' + data[c.key] + '</div><div class="label">' + c.label + '</div>';
        grid.appendChild(div);
      });
    })
    .catch(function () {
      document.getElementById('error').style.display = 'block';
    });
})();
</script>

</body>
</html>
